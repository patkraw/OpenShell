# Provider profile for the NVIDIA inference API, used by the mixed-harness
# child sandbox demo. Every harness in the demo images runs on node, so the
# binaries name node and the global npm folder as well as curl.
#
#   openshell provider profile import --file examples/child-sandboxes/images/nvidia-inference.yaml

id: nvidia-inference
display_name: NVIDIA Inference API
description: NVIDIA inference API at inference-api.nvidia.com
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: NVIDIA inference API key
    env_vars: [NVIDIA_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: inference-api.nvidia.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/bin/curl
  - /usr/local/bin/node
  - "/usr/local/lib/node_modules/**"
