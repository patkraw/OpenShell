# The policy a root on child-base:local starts with, plus one network rule
# that lets curl reach example.com. Tutorial 05 applies it to a running root.
# A live update cannot remove filesystem paths, so the paths below match the
# root's current policy exactly.

version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /etc, /var/log]
  read_write: [/tmp, /dev/null]

landlock:
  compatibility: best_effort

network_policies:
  example_web:
    name: example_web
    endpoints:
      - { host: example.com, port: 443 }
    binaries:
      - { path: /usr/bin/curl }
