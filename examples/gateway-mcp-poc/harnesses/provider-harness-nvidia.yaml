# NVIDIA's inference API for every harness in the matrix. The key stays in
# OpenShell; inside a sandbox OPENAI_API_KEY is a placeholder, swapped in only
# for these programs' requests to inference-api.nvidia.com.
id: harness-nvidia
display_name: Harness matrix (NVIDIA inference API)
description: Pi, Qwen Code, Codex, OpenCode, mini-SWE-agent and Deep Agents with models from inference-api.nvidia.com
category: agent
inference_capable: true
credentials:
  - name: api_key
    description: NVIDIA inference API key
    env_vars: [OPENAI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: inference-api.nvidia.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/local/bin/node
  - /usr/bin/python3.11
  - /usr/local/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-arm64/vendor/aarch64-unknown-linux-musl/bin/codex
  - /usr/local/lib/node_modules/opencode-ai/bin/opencode.exe
