# Hermes config seed, copied into HERMES_HOME by hermes-run.
# OPENAI_API_KEY in the sandbox is only a placeholder; the supervisor swaps in
# the real key for inference-api.nvidia.com.
_config_version: 50  # current schema for this release, so Hermes does not migrate it
model:
  provider: custom:nvidia
  default: aws/anthropic/bedrock-claude-sonnet-5-5
providers:
  nvidia:
    name: NVIDIA Inference
    api: https://inference-api.nvidia.com/v1
    key_env: OPENAI_API_KEY
    # Set explicitly: the model id names Anthropic, but this is the OpenAI wire.
    transport: chat_completions
    discover_models: false
    default_model: aws/anthropic/bedrock-claude-sonnet-5-5
    models:
      aws/anthropic/bedrock-claude-sonnet-5-5:
        context_length: 200000

mcp_servers:
  openshell:
    url: http://openshell.local/mcp
    timeout: 600
    connect_timeout: 60
    sampling:
      enabled: false

agent:
  # `delegate_task` (the `delegation` toolset) stays on so the matrix sees which
  # spawn path the model picks. To turn it off: disabled_toolsets: [delegation]
  disabled_toolsets: []

updates:
  check: false
telemetry:
  shared_metrics:
    enabled: false
    send: false
